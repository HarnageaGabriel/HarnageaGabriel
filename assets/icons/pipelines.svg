      @keyframes ppglow { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.7; } }
      .ppf { animation: ppframe 3s ease-in-out infinite; }
      .ppg { animation: ppglyph 3s ease-in-out infinite; }
      .ppl { animation: ppglow 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <radialGradient id="ppglowg" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
