  <rect class="ppf" x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1F6FEB" stroke-width="1.5" stroke-opacity="0.6"/>
  <g class="ppg" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="32" r="4"/>
