<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pipelines">
  <defs>
    <style>
      @keyframes ppframe { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.9; } }
