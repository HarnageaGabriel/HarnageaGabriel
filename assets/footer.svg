<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="read-only by default, deterministic by design">
  <defs>
    <style>
      @keyframes fdrift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -16px); } }
      @keyframes fdrift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-26px, 12px); } }
      @keyframes fwave1 { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-50px); } }
      @keyframes fwave2 { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(55px); } }
      @keyframes fblink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .fb1 { animation: fdrift1 18s ease-in-out infinite; }
      .fb2 { animation: fdrift2 22s ease-in-out infinite; }
      .fw1 { animation: fwave1 9s ease-in-out infinite; }
      .fw2 { animation: fwave2 7s ease-in-out infinite; }
      @keyframes ftype { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }
      @keyframes fmove { 0% { transform: translateX(-486px); } 60%, 100% { transform: translateX(0); } }
      .ftype { transform-box: fill-box; transform-origin: left; animation: ftype 8s steps(45) infinite; }
      .fcur { animation: fblink 1.2s steps(1) infinite; }
      .fmove { animation: fblink 1.2s steps(1) infinite, fmove 8s steps(45) infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="70%" stop-color="#10161F"/>
      <stop offset="100%" stop-color="#132A4A"/>
    </linearGradient>
    <linearGradient id="fwave1g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#39D0D8" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="fwave2g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EA9FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="fblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="fclip"><rect width="1200" height="160"/></clipPath>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1200" height="160" fill="url(#fbg)"/>

    <circle class="fb1" cx="260" cy="140" r="90" fill="#1F6FEB" opacity="0.14" filter="url(#fblur)"/>
    <circle class="fb2" cx="960" cy="150" r="100" fill="#39D0D8" opacity="0.09" filter="url(#fblur)"/>

    <clipPath id="ftypeclip"><rect class="ftype" x="368" y="50" width="486" height="30"/></clipPath>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="346" y="72" fill="#58A6FF">$</text>
      <text x="368" y="72" fill="#E6EDF3" clip-path="url(#ftypeclip)">read-only by default, deterministic by design</text>
      <rect class="fcur fmove" x="857" y="57" width="10" height="19" fill="#58A6FF"/>
    </g>

    <g class="fw1">
      <path fill="url(#fwave1g)" d="M-100 112 C 50 88, 200 136, 350 112 C 500 88, 650 136, 800 112 C 950 88, 1100 136, 1300 112 L1300 160 L-100 160 Z"/>
    </g>
    <g class="fw2">
      <path fill="url(#fwave2g)" d="M-100 132 C 60 112, 220 152, 380 132 C 540 112, 700 152, 860 132 C 1020 112, 1180 152, 1300 132 L1300 160 L-100 160 Z"/>
    </g>
  </g>
</svg>