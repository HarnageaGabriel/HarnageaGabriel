<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="img" aria-label="">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="20%" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#39d0d8" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#1f6feb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="5" width="1200" height="2" fill="url(#dline)"/>

  <g>
    <circle cx="0" cy="6" r="3" fill="#58a6ff">
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" from="120 0" to="1080 0" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
