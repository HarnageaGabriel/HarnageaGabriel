<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" width="1200" height="18" role="img" aria-label="Decorative animated divider">
  <defs>
    <style>
      @keyframes dvrun { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(1200px); opacity: 0; } }
      @keyframes dvbreathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.3); opacity: 1; } }
      .dvr { opacity: 0; animation: dvrun 5s linear infinite; }
      .dvb { transform-box: fill-box; transform-origin: center; animation: dvbreathe 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <linearGradient id="dvline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#1F6FEB" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#39D0D8" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#1F6FEB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="8" width="1200" height="2" fill="url(#dvline)"/>

  <g class="dvr">
    <circle cx="0" cy="9" r="7" fill="#58A6FF" opacity="0.25"/>
    <circle cx="0" cy="9" r="3" fill="#58A6FF"/>
  </g>

  <g transform="translate(600 9) rotate(45)">
    <rect class="dvb" x="-5" y="-5" width="10" height="10" fill="#39D0D8" stroke="#58A6FF" stroke-width="1"/>
  </g>
</svg>