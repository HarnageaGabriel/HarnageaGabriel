<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Gabriel Harnagea — DevOps and Platform Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#111a2e;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#132a4a">
        <animate attributeName="stop-color" values="#132a4a;#1b3b66;#132a4a" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f6feb">
        <animate attributeName="stop-color" values="#1f6feb;#2ea9ff;#1f6feb" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#39d0d8" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9ad4ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#sky)"/>

  <!-- drifting grid, a faint nod to a cluster topology -->
  <g stroke="#58a6ff" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 40 H1200 M0 90 H1200 M0 140 H1200 M0 190 H1200"/>
    <g>
      <path d="M60 0 V220 M180 0 V220 M300 0 V220 M420 0 V220 M540 0 V220 M660 0 V220 M780 0 V220 M900 0 V220 M1020 0 V220 M1140 0 V220"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;120 0;0 0" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- back wave -->
  <g>
    <path fill="url(#wave1)" d="M0 168 C 150 138, 300 198, 450 168 C 600 138, 750 198, 900 168 C 1050 138, 1150 188, 1200 168 L1200 220 L0 220 Z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- front wave -->
  <g>
    <path fill="url(#wave2)" d="M0 186 C 160 162, 320 210, 480 186 C 640 162, 800 210, 960 186 C 1100 166, 1160 200, 1200 186 L1200 220 L0 220 Z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0" dur="7s" repeatCount="indefinite"/>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">
    <text x="600" y="96" font-size="46" font-weight="700" fill="url(#fade)" letter-spacing="1.5">
      Gabriel Harnagea
      <animate attributeName="opacity" from="0" to="1" dur="1.1s" fill="freeze"/>
    </text>
    <text x="600" y="132" font-size="16" font-weight="500" fill="#9fb6d0" letter-spacing="3.2">
      DevOps &amp; Platform Engineer
      <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="158" font-size="13" fill="#58a6ff" letter-spacing="2.4">
      Azure · Kubernetes · GitOps · Terraform
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="1.2s" fill="freeze"/>
    </text>
  </g>
</svg>
